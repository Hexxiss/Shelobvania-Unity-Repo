name: Promote RC to Release (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Promote RC to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' > /dev/null 2>&1; then
            CURRENT=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//')
          else
            CURRENT="0.0.0"
          fi

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          HOTFIX=$(echo "$CURRENT" | cut -d. -f3)

          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No PR found for this commit. All changes must go through a PR so an RC exists to promote."
            exit 1
          fi

          RELEASE_TYPE=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
            --jq '[.[].name | select(startswith("release-type: ")) | ltrimstr("release-type: ")] | .[0] // "hotfix"')

          case "$RELEASE_TYPE" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; HOTFIX=0 ;;
            minor)
              MINOR=$((MINOR + 1)); HOTFIX=0 ;;
            *)
              HOTFIX=$((HOTFIX + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${HOTFIX}"

          PRODUCT=$(grep 'productName:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          PRODUCT_LOWER=$(echo "$PRODUCT" | tr '[:upper:]' '[:lower:]')

          echo "CURRENT_VERSION=${CURRENT}"     >> "$GITHUB_OUTPUT"
          echo "VERSION=${NEW_VERSION}"          >> "$GITHUB_OUTPUT"
          echo "RELEASE_TYPE=${RELEASE_TYPE}"    >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=${PR_NUMBER}"           >> "$GITHUB_OUTPUT"
          echo "PRODUCT=${PRODUCT}"              >> "$GITHUB_OUTPUT"
          echo "PRODUCT_LOWER=${PRODUCT_LOWER}"  >> "$GITHUB_OUTPUT"

      - name: Show version bump
        run: |
          echo "Release type    : ${{ steps.version.outputs.RELEASE_TYPE }}"
          echo "Current version : v${{ steps.version.outputs.CURRENT_VERSION }}"
          echo "New version     : v${{ steps.version.outputs.VERSION }}"

      - name: Download RC release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RC_TAG=rc-pr${{ steps.version.outputs.PR_NUMBER }}
          RELEASE_ZIP="${{ steps.version.outputs.PRODUCT }}-Windows-${{ steps.version.outputs.VERSION }}.zip"
          gh release download "${RC_TAG}" --pattern "*.zip" --dir .
          mv *.zip "${RELEASE_ZIP}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    v${{ steps.version.outputs.VERSION }}
          name:        ${{ steps.version.outputs.PRODUCT_LOWER }}_v${{ steps.version.outputs.VERSION }}
          body:        |
            **Release type:** `${{ steps.version.outputs.RELEASE_TYPE }}`
            **Previous version:** `v${{ steps.version.outputs.CURRENT_VERSION }}`
            **New version:** `v${{ steps.version.outputs.VERSION }}`
            **Promoted from:** `rc-pr${{ steps.version.outputs.PR_NUMBER }}`
            **Commit:** ${{ github.sha }}

            **Platform:** Windows x64 Standalone
          files:       ${{ steps.version.outputs.PRODUCT }}-Windows-${{ steps.version.outputs.VERSION }}.zip
          make_latest: true

      - name: Delete release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete rc-pr${{ steps.version.outputs.PR_NUMBER }} --yes || true
          git push origin :refs/tags/rc-pr${{ steps.version.outputs.PR_NUMBER }} || true
