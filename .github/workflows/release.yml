name: Build and Release (Windows)

on:
  push:
    branches:
      - main
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Build Unity Project (Windows)
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' > /dev/null 2>&1; then
            CURRENT=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//')
          else
            CURRENT="0.0.0"
          fi

          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          HOTFIX=$(echo "$CURRENT" | cut -d. -f3)

          PR_NUMBER=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')

          RELEASE_TYPE="hotfix"
          if [ -n "$PR_NUMBER" ]; then
            RELEASE_TYPE=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
              --jq '[.[].name | select(startswith("release-type: ")) | ltrimstr("release-type: ")] | .[0] // "hotfix"')
          fi

          case "$RELEASE_TYPE" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; HOTFIX=0 ;;
            minor)
              MINOR=$((MINOR + 1)); HOTFIX=0 ;;
            *)
              HOTFIX=$((HOTFIX + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${HOTFIX}"

          echo "CURRENT_VERSION=${CURRENT}"   >> "$GITHUB_OUTPUT"
          echo "VERSION=${NEW_VERSION}"        >> "$GITHUB_OUTPUT"
          echo "RELEASE_TYPE=${RELEASE_TYPE}"  >> "$GITHUB_OUTPUT"
          echo "PR_NUMBER=${PR_NUMBER}"         >> "$GITHUB_OUTPUT"

      - name: Show version bump
        run: |
          echo "Release type    : ${{ steps.version.outputs.RELEASE_TYPE }}"
          echo "Current version : v${{ steps.version.outputs.CURRENT_VERSION }}"
          echo "New version     : v${{ steps.version.outputs.VERSION }}"

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-
            Library-

      - name: Build project (Windows Standalone x64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:      "."
          targetPlatform:   StandaloneWindows64
          buildName:        Shelobvania
          buildsPath:       build

      - name: Zip Windows build
        run: |
          cd build/StandaloneWindows64
          zip -r ../../Shelobvania-Windows-${{ steps.version.outputs.VERSION }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shelobvania-Windows-${{ steps.version.outputs.VERSION }}
          path: Shelobvania-Windows-${{ steps.version.outputs.VERSION }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    v${{ steps.version.outputs.VERSION }}
          name:        Release v${{ steps.version.outputs.VERSION }}
          body:        |
            **Release type:** `${{ steps.version.outputs.RELEASE_TYPE }}`
            **Previous version:** `v${{ steps.version.outputs.CURRENT_VERSION }}`
            **New version:** `v${{ steps.version.outputs.VERSION }}`
            **Commit:** ${{ github.sha }}

            **Platform:** Windows x64 Standalone
          files:       Shelobvania-Windows-${{ steps.version.outputs.VERSION }}.zip
          make_latest: true

      - name: Delete release candidate
        if: steps.version.outputs.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete rc-pr${{ steps.version.outputs.PR_NUMBER }} --yes || true
          git push origin :refs/tags/rc-pr${{ steps.version.outputs.PR_NUMBER }} || true
