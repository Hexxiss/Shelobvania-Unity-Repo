name: Build Release Candidate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  build-rc:
    name: Build Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set RC tag
        id: version
        run: echo "RC_TAG=rc-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-
            Library-

      - name: Build project (Windows Standalone x64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:    "."
          targetPlatform: StandaloneWindows64
          buildName:      Shelobvania
          buildsPath:     build

      - name: Zip Windows build
        run: |
          cd build/StandaloneWindows64
          zip -r ../../Shelobvania-Windows-${{ steps.version.outputs.RC_TAG }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shelobvania-Windows-${{ steps.version.outputs.RC_TAG }}
          path: Shelobvania-Windows-${{ steps.version.outputs.RC_TAG }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Delete existing RC release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ steps.version.outputs.RC_TAG }} --yes || true
          git push origin :refs/tags/${{ steps.version.outputs.RC_TAG }} || true

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.version.outputs.RC_TAG }}
          name:       ${{ steps.version.outputs.RC_TAG }}
          prerelease: true
          body: |
            **Release candidate for PR #${{ github.event.pull_request.number }}**
            **Branch:** `${{ github.head_ref }}`
            **Commit:** ${{ github.sha }}

            **Platform:** Windows x64 Standalone
          files: Shelobvania-Windows-${{ steps.version.outputs.RC_TAG }}.zip
